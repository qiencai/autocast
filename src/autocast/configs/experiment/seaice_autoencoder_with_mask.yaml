# @package _global_
# Autoencoder for sea ice: encoder takes SIC + land mask (2ch), decoder reconstructs SIC only (1ch).
defaults:
  - optional simulator: null
  - optional optimizer: null
  - optional experiment: null
  - optional local_experiment: null
  - override /datamodule: osisaf_nh_sic
  - override /model: autoencoder
  - override /trainer: default
  - override /logging: wandb
  - _self_

seed: 42
experiment_name: seaice_autoencoder_with_mask

datamodule:
  autoencoder_mode: true
  batch_size: 8

logging:
  wandb:
    enabled: true

model:
  encoder:
    # with_constants=True: preprocess() will concatenate constant_fields (land mask) into input
    # setup.py then adds n_constant_field_channels to in_channels → 1 + 1 = 2
    in_channels: null
    with_constants: true
  decoder:
    # out_channels stays 1 — reconstruct SIC only
    out_channels: null

output:
  checkpoint_name: seaice_autoencoder_with_mask.ckpt
  checkpoint_path: null
  save_config: true
  skip_test: false

trainer:
  max_epochs: 20
  # max_time: "00:01:00:00"  # 25 minutes (DD:HH:MM:SS)

# trainer:
#   max_epochs: 1
#   limit_train_batches: 1
#   limit_val_batches: 1
#   limit_test_batches: 1
