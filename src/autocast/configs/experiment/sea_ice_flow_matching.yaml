# @package _global_
defaults:
  - override /datamodule: osisaf_nh_sic
  - override /encoder@model.encoder: dc_deep_256_v2
  - override /decoder@model.decoder: dc_deep_256_v2
  # - override /encoder@model.encoder: identity
  # - override /decoder@model.decoder: identity
  - override /processor@model.processor: flow_matching
  - _self_

experiment_name: sea_ice_flow_matching

datamodule:
  use_normalization: false
  batch_size: 1

logging:
  wandb:
    enabled: false

optimizer:
  learning_rate: 0.0002

model:
  train_in_latent_space: true
  processor:
    backbone:
      hid_channels: [512]

trainer:
  max_epochs: 1
  limit_train_batches: 1
  limit_val_batches: 1
  limit_test_batches: 1